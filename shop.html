<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин — СТЦ «Баррикада»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe9dd; --ink:#191510; --paper:#f7f2e8; --accent:#d2401e; --line:#191510;
    --muted:#6b6152; --shadow:rgba(25,21,16,.18);
  }
  html[data-theme="dark"]{
    --bg:#161310; --ink:#ece5d8; --paper:#201c17; --accent:#ff5a33; --line:#ece5d8;
    --muted:#9a9080; --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .4s,color .4s;overflow-x:hidden}

  /* 3D-фон: цветные объёмные стройматериалы */
  .bg3d{position:fixed;inset:0;z-index:-1;perspective:1000px;overflow:hidden;pointer-events:none}
  .bg-world{position:absolute;left:50%;top:45%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
  .bg-item{position:absolute;transform-style:preserve-3d}
  .bg-item .face{position:absolute;left:0;top:0;border-radius:4px}
  .bg-item .front{border:2px solid rgba(0,0,0,.25)}
  .bg-item .top{border:2px solid rgba(0,0,0,.12);filter:brightness(1.35)}
  .bg-item .side{border:2px solid rgba(0,0,0,.35);filter:brightness(.7)}
  /* кирпич: лицевая кладка */
  .bg-item.brick .front::before,.bg-item.brick .front::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.3)}
  .bg-item.brick .front::after{top:0;bottom:0;left:50%;width:2px;height:auto;background:rgba(0,0,0,.3)}
  /* доска: текстура */
  .bg-item.plank .front::before{content:"";position:absolute;left:8%;right:8%;top:30%;height:2px;background:rgba(0,0,0,.18);box-shadow:0 8px 0 rgba(0,0,0,.18)}
  .bg-dot{position:absolute;border-radius:50%;background:var(--accent);opacity:.25}
  h1,h2,h3,.logo{font-family:'Unbounded',sans-serif}
  a{color:inherit}
  .veil{position:fixed;inset:0;background:var(--ink);z-index:100;transform:scaleY(0);transform-origin:bottom;pointer-events:none;animation:veil .7s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes veil{0%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}

  header{display:flex;align-items:center;justify-content:space-between;padding:20px 4vw;border-bottom:2px solid var(--line)}
  .logo{font-weight:900;font-size:20px;letter-spacing:-.5px;cursor:pointer}
  .logo em{color:var(--accent);font-style:normal}
  nav{display:flex;gap:8px;align-items:center}
  nav a{text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;border:2px solid transparent;border-radius:999px;transition:border-color .2s,background .2s}
  nav a:hover{border-color:var(--line)}
  nav a.active{background:var(--ink);color:var(--bg)}
  #themeBtn{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;transition:transform .15s}
  #themeBtn:hover{transform:rotate(-4deg) scale(1.05)}

  .wrap{max-width:1100px;margin:0 auto;padding:6vh 20px 10vh}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:28px}
  .crumb a{color:var(--accent);text-decoration:none;font-weight:600}
  .head{position:relative;overflow:hidden;padding:5vh 4vw 5vh;margin:0 -4vw 48px}
  .head::before{content:"";position:absolute;inset:0;background:url("img/building.jpg") center 30%/cover no-repeat;opacity:.14;filter:saturate(.7);pointer-events:none;mask-image:linear-gradient(to bottom,black 45%,transparent);-webkit-mask-image:linear-gradient(to bottom,black 45%,transparent)}
  .head>*{position:relative}

  .head{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start;margin-bottom:48px}
  .head h1{font-size:clamp(30px,5vw,56px);font-weight:900;line-height:1;letter-spacing:-1.5px;text-transform:uppercase;margin-bottom:14px}
  .head .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .pill{font-size:12px;font-weight:600;padding:5px 14px;border:1.5px solid var(--line);border-radius:999px}
  .pill.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
  .head p{color:var(--muted);font-size:16px;line-height:1.65;max-width:480px}

  .photo-card{background:var(--paper);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:10px 10px 0 var(--shadow)}
  .photo-card img{width:100%;height:300px;object-fit:cover;display:block}

  .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:48px}
  .info .cell{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:18px 20px}
  .info .k{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .info .v{font-size:16px;font-weight:600}
  .info a.v{color:var(--accent);text-decoration:none;border-bottom:2px solid var(--accent)}

  h2.block{font-size:clamp(20px,3vw,28px);letter-spacing:-.5px;margin-bottom:18px;text-transform:uppercase}
  .services{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:48px}
  .services span{border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600}

  .actions{display:flex;gap:14px;flex-wrap:wrap}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border:none;border-radius:999px;padding:14px 30px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:5px 5px 0 var(--shadow)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

  footer{border-top:2px solid var(--line);padding:28px 4vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
  @media(max-width:820px){.head{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg3d"><div class="bg-world" id="bgWorld"></div></div>
<div class="veil"></div>

<header>
  <div class="logo" data-go="index.html">СТЦ <em>«Баррикада»</em></div>
  <nav>
    <a href="#" data-go="index.html">Магазины</a>
    <a href="#" data-go="rent.html">Аренда</a>
    <button id="themeBtn">☾ темно</button>
  </nav>
</header>

<div class="wrap" id="content">
  <div class="crumb"><a href="#" data-go="index.html">← Все магазины</a></div>
  <div id="shop"></div>
</div>

<footer>
  <span>© СТЦ «Баррикада», 2026</span>
  <span>г. Орехово-Зуево, ул. Урицкого, 92 · +7 (495) 123-45-67 · info@barrikada-tc.ru</span>
</footer>

<script>
const shops=[
  {name:"ИнструментПроф",cat:"Инструмент",floor:1,img:"img/shop1.svg",desc:"Электро- и бензоинструмент, расходники и оснастка. Ремонт и заточка на месте, гарантийное обслуживание.",phone:"+7 (495) 111-22-01",services:["Ремонт инструмента","Заточка","Гарантийное обслуживание","Оптовый отдел"],hours:"8:00 — 21:00"},
  {name:"Краска&Декор",cat:"Краски",floor:1,img:"img/shop2.svg",desc:"Краски, лаки, штукатурки и декоративные покрытия. Колеровка в подарок, доставка на объект.",phone:"+7 (495) 111-22-02",services:["Колеровка","Доставка на объект","Подбор по каталогам RAL/NCS"],hours:"8:00 — 21:00"},
  {name:"ПлиткаМир",cat:"Плитка",floor:1,img:"img/shop3.svg",desc:"Керамогранит, керамическая плитка, мозаика и клинкер. Более 500 коллекций в наличии и под заказ.",phone:"+7 (495) 111-22-03",services:["3D-визуализация раскладки","Резка керамогранита","Доставка"],hours:"8:00 — 21:00"},
  {name:"Сантехника Дом",cat:"Сантехника",floor:2,img:"img/shop4.svg",desc:"Смесители, ванны, душевые кабины, инженерная сантехника и фитинги. Услуги подбора и доставки.",phone:"+7 (495) 111-22-04",services:["Подбор комплекта","Доставка","Замер"],hours:"8:00 — 21:00"},
  {name:"ЭлектрикаЦентр",cat:"Электрика",floor:2,img:"img/shop5.svg",desc:"Кабель, автоматика, щитовое оборудование, светильники. Расчёт кабельных трасс по проекту.",phone:"+7 (495) 111-22-05",services:["Расчёт по проекту","Сборка щитов","Опт от 50 000 ₽"],hours:"8:00 — 21:00"},
  {name:"ДревоМаркет",cat:"Дерево",floor:2,img:"img/shop6.svg",desc:"Пиломатериалы, фанера, ОСП, вагонка и доска пола. Раскрой по размерам заказчика.",phone:"+7 (495) 111-22-06",services:["Раскрой по размерам","Погрузка","Доставка манипулятором"],hours:"8:00 — 21:00"},
  {name:"КрепёжОпт",cat:"Крепёж",floor:3,img:"img/shop7.svg",desc:"Болты, гайки, саморезы, анкеры, метизы и такелаж. Оптовые цены от одной коробки.",phone:"+7 (495) 111-22-07",services:["Опт от коробки","Под заказ 1–3 дня","Паллетная отгрузка"],hours:"8:00 — 21:00"},
  {name:"ОкнаСтиль",cat:"Окна",floor:3,img:"img/shop8.svg",desc:"Окна ПВХ и алюминий, двери, жалюзи и рольставни. Замер и монтаж за один день.",phone:"+7 (495) 111-22-08",services:["Бесплатный замер","Монтаж за день","Рассрочка"],hours:"8:00 — 21:00"},
  {name:"Камень&Сыпучие",cat:"Материалы",floor:3,img:"img/shop9.svg",desc:"Щебень, песок, цемент, кирпич и блоки. Погрузка в машину на территории СТЦ.",phone:"+7 (495) 111-22-09",services:["Погрузка на территории","Доставка самосвалом","Продажа от 1 мешка"],hours:"8:00 — 21:00"},
];

const id=parseInt(new URLSearchParams(location.search).get('id'))||0;
const s=shops[id];
document.title=s.name+' — СТЦ «Баррикада»';
document.getElementById('shop').innerHTML=`
  <div class="head">
    <div>
      <h1>${s.name}</h1>
      <div class="meta">
        <span class="pill acc">${s.cat}</span>
        <span class="pill">Этаж ${s.floor}</span>
        <span class="pill">${s.hours}</span>
      </div>
      <p>${s.desc}</p>
    </div>
    <div class="photo-card"><img src="${s.img}" alt="${s.name}"></div>
  </div>
  <div class="info">
    <div class="cell"><div class="k">Телефон</div><a class="v" href="tel:${s.phone.replace(/[^+\d]/g,'')}">${s.phone}</a></div>
    <div class="cell"><div class="k">Расположение</div><div class="v">Этаж ${s.floor}, блок 10${id+1}</div></div>
    <div class="cell"><div class="k">Часы работы</div><div class="v">Ежедневно ${s.hours}</div></div>
  </div>
  <h2 class="block">Услуги</h2>
  <div class="services">${s.services.map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="actions">
    <a class="btn" href="tel:${s.phone.replace(/[^+\d]/g,'')}">Позвонить</a>
    <a class="btn ghost" href="#" data-go="index.html">← Ко всем магазинам</a>
  </div>
</div>`;

document.querySelectorAll('[data-go]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const v=document.querySelector('.veil');
    v.style.transform='scaleY(1)'; v.style.transformOrigin='top';
    setTimeout(()=>location.href=a.dataset.go,300);
  });
});

/* 3D-фон: цветные объёмные стройматериалы + движение со скроллом */
const bgWorld=document.getElementById('bgWorld');
(function buildBg(){
  const rnd=(i)=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);};
  // материалы: [цвет лицевой грани, ширина, высота, глубина, класс]
  const mats=[
    ['#c2571b',86,44,40,'brick'],   // кирпич
    ['#e8a13a',120,26,30,'plank'],  // доска
    ['#2b6cb0',58,52,44,''],        // ведро (брусок-корпус)
    ['#c53030',96,30,30,'plank'],   // труба/брус
    ['#2c6e3f',60,60,34,''],        // гайка-блок
    ['#b83280',70,40,36,'brick'],   // блок
  ];
  for(let i=0;i<13;i++){
    const [c,w,h,d,cls]=mats[i%mats.length];
    const el=document.createElement('div');
    el.className='bg-item '+(cls||'brick');
    const s=.7+rnd(i)*.8; // масштаб
    const W=w*s,H=h*s,D=d*s;
    el.innerHTML=`
      <div class="face front" style="width:${W}px;height:${H}px;background:${c};transform:translate(-50%,-50%) translateZ(${D/2}px)"></div>
      <div class="face back" style="width:${W}px;height:${H}px;background:${c};transform:translate(-50%,-50%) rotateY(180deg) translateZ(${D/2}px)"></div>
      <div class="face top" style="width:${W}px;height:${D}px;background:${c};transform:translate(-50%,-50%) rotateX(90deg) translateZ(${H/2}px)"></div>
      <div class="face bottom" style="width:${W}px;height:${D}px;background:${c};transform:translate(-50%,-50%) rotateX(-90deg) translateZ(${H/2}px)"></div>
      <div class="face side" style="width:${D}px;height:${H}px;background:${c};transform:translate(-50%,-50%) rotateY(90deg) translateZ(${W/2}px)"></div>
      <div class="face side" style="width:${D}px;height:${H}px;background:${c};transform:translate(-50%,-50%) rotateY(-90deg) translateZ(${W/2}px)"></div>`;
    el.style.left=(rnd(i+10)*1300-650)+'px';
    el.style.top=(rnd(i+20)*850-425)+'px';
    const z=-rnd(i+30)*550;
    const rz=rnd(i+40)*40-20;
    el.dataset.base=`translateZ(${z}px) rotateZ(${rz}deg)`;
    el.style.transform=el.dataset.base;
    el.style.opacity=.85;
    bgWorld.appendChild(el);
    // лёгкое парение
    const spd=2.5+rnd(i+50)*2, amp=8+rnd(i+60)*10, ph=rnd(i+70)*6.28;
    (function float(el){
      const t=performance.now()/1000;
      el.style.transform=el.dataset.base+` translateY(${Math.sin(t*spd+ph)*amp}px)`;
      requestAnimationFrame(()=>float(el));
    })(el);
  }
  for(let i=0;i<8;i++){
    const d=document.createElement('div');
    d.className='bg-dot';
    const r=4+rnd(i+110)*10;
    d.style.width=r+'px'; d.style.height=r+'px';
    d.style.left=(rnd(i+120)*1200-600)+'px';
    d.style.top=(rnd(i+130)*800-400)+'px';
    d.style.transform=`translateZ(${-rnd(i+140)*600}px)`;
    bgWorld.appendChild(d);
  }
})();
let bgRX=62, bgRZ=-28;
function bgApply(s){bgWorld.style.transform=`translateY(${s*.18}px) rotateX(${bgRX-s*.006}deg) rotateZ(${bgRZ+s*.004}deg)`;}
addEventListener('scroll',()=>bgApply(scrollY),{passive:true});
bgApply(scrollY);

const btn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;btn.textContent=t==='dark'?'☀ светло':'☾ темно';localStorage.theme=t;}
setTheme(localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
btn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
</script>
</body>
</html>
